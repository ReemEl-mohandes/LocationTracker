# Pinned so running from server/ keeps the same containers and, crucially, the same
# locationtracker_pgdata volume as before the client/server split. Without it Compose
# would name the project after this folder ("server") and start an empty database.
name: locationtracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately not published to the host. Uncomment only to attach a local client,
    # and remember that doing so exposes the database beyond the compose network.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build:
      context: ./src/LocationTracker.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-LocationTracker}
      Jwt__Audience: ${JWT_AUDIENCE:-LocationTracker}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://localhost}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    depends_on:
      db:
        # Waits for the database to accept connections, not merely for the container to
        # exist. Migrations run at startup and would otherwise fail the race.
        condition: service_healthy
    healthcheck:
      # curl is installed explicitly in the Dockerfile: the aspnet runtime image does
      # not ship it, and without it this check fails forever and the service never
      # reports healthy.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # The admin web page lives with the other client code; nginx serves it at /admin/.
      - ../client/wwwroot:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks: [backend]

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
